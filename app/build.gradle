plugins { id 'com.android.application' }

android {
    namespace 'it.ritrova.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.ritrova.app'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0-beta'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
